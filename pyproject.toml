[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platewatch"
version = "0.1.0"
description = "Read number plates from any ONVIF/RTSP camera stream and push results to webhooks, a dashboard and Telegram"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fast-alpr[onnx]>=0.4",
  "opencv-python-headless>=4.8",
  "numpy",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
platewatch = "platewatch.cli:main"

[tool.setuptools.packages.find]
include = ["platewatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
